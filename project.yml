name: Orbit
options:
  bundleIdPrefix: com.lyu
  developmentLanguage: en
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.0.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "5"
    DEVELOPMENT_TEAM: UM52UU4B7L
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: 7CBA1EA9C27F25912D4A2774F0D1B98B6C5A7BF5
    ENABLE_HARDENED_RUNTIME: YES
    MACOSX_DEPLOYMENT_TARGET: "15.0"
targets:
  Orbit:
    type: application
    platform: macOS
    sources:
      - path: Orbit
        excludes:
          - Resources/Orbit.icon
          - Resources/Orbit.icon/**
      - path: Orbit/Resources/Orbit.icon
        type: file
        buildPhase: resources
      - path: LaunchDaemons/com.lyu.orbit.fanhelper.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    dependencies:
      - package: KeyboardShortcuts
      - target: OrbitFanHelper
        embed: true
        codeSign: false
        copy:
          destination: executables
      - target: OrbitQuickLook
        embed: true
      - target: OrbitMediaRemote
        embed: true
        link: false
        copy:
          destination: frameworks
    info:
      path: Orbit/Info.plist
      properties:
        CFBundleDisplayName: Orbit
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "© 2026 Orbit"
        NSScreenCaptureUsageDescription: Orbit needs screen access to take screenshots and recognize text on screen.
        NSAppleEventsUsageDescription: Orbit uses this to switch Dark Mode and empty the Trash when you ask it to.
        NSCalendarsFullAccessUsageDescription: Orbit shows your events in the menu bar calendar. They never leave this Mac.
        NSAudioCaptureUsageDescription: Orbit routes each app's sound through its volume and EQ controls. Nothing is recorded.
        NSCameraUsageDescription: Orbit uses the camera on this Mac to recognize your face and unlock the apps you locked, and for the notch mirror when you turn it on. Nothing leaves your Mac.
        NSBluetoothAlwaysUsageDescription: Orbit shows a notice in the notch when your AirPods or other Bluetooth devices connect, with their battery level.
        NSMicrophoneUsageDescription: Orbit records your microphone only while you're making a screen recording with it turned on.
        # Archives: Orbit can be the app that opens these (Archives page › "Open archives with Orbit").
        CFBundleDocumentTypes:
          - CFBundleTypeName: Archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.zip-archive
              - org.7-zip.7-zip-archive
              - com.rarlab.rar-archive
              - public.tar-archive
              - org.gnu.gnu-zip-archive
              - org.gnu.gnu-zip-tar-archive
              - public.bzip2-archive
              - public.tar-bzip2-archive
              - org.tukaani.xz-archive
              - org.tukaani.tar-xz-archive
              - public.lzip-archive
              - org.tukaani.lzma-archive
              - com.facebook.zstandard-archive
              - public.z-archive
              - public.cpio-archive
              - public.archive.lha
              - com.microsoft.cab
              - public.archive
        NSServices:
          - NSMenuItem:
              default: Compress with Orbit
            NSMessage: compressWithOrbit
            NSPortName: Orbit
            NSRequiredContext: {}
            NSSendFileTypes:
              - public.item
          - NSMenuItem:
              default: Extract with Orbit
            NSMessage: extractWithOrbit
            NSPortName: Orbit
            NSRequiredContext: {}
            NSSendFileTypes:
              - public.zip-archive
              - org.7-zip.7-zip-archive
              - com.rarlab.rar-archive
              - public.tar-archive
              - org.gnu.gnu-zip-archive
              - org.gnu.gnu-zip-tar-archive
              - public.bzip2-archive
              - public.tar-bzip2-archive
              - org.tukaani.xz-archive
              - org.tukaani.tar-xz-archive
              - public.lzip-archive
              - org.tukaani.lzma-archive
              - com.facebook.zstandard-archive
              - public.z-archive
              - public.cpio-archive
              - public.archive.lha
              - com.microsoft.cab
              - public.archive
    entitlements:
      path: Orbit/Orbit.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.automation.apple-events: true
        # Hardened Runtime blocks these privacy prompts unless the app declares them.
        com.apple.security.personal-information.calendars: true
        com.apple.security.device.camera: true
        com.apple.security.device.audio-input: true
    preBuildScripts:
      - name: Settings search index
        basedOnDependencyAnalysis: false
        script: |
          # Rebuilt from the page sources every build; rewritten only when it changes.
          cd "${PROJECT_DIR}" && /usr/bin/python3 tools/settings_index.py
    postBuildScripts:
      - name: Embed Tavi input method
        basedOnDependencyAnalysis: false
        script: |
          # Tavi (automatic 한/영) must live in its own input-method bundle; Orbit carries it and installs it.
          # Newest of: a local Tavi build next to Orbit, or the verified release from tools/fetch-tavi.sh.
          dst="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Helpers"
          src=""; best=0
          for c in "${PROJECT_DIR}/../tavi/dist/Tavi.app/Contents/Helpers/TaviInputMethod.app" "${PROJECT_DIR}/tools/tavi-cache/TaviInputMethod.app"; do
            [ -d "$c" ] || continue
            v=$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" "$c/Contents/Info.plist" 2>/dev/null || echo 0)
            if [ "$v" -gt "$best" ] 2>/dev/null; then best=$v; src=$c; fi
          done
          if [ -z "$src" ]; then
            if [ "$CONFIGURATION" = "Release" ]; then echo "error: Tavi missing — run tools/fetch-tavi.sh (or build ../tavi) before a Release build"; exit 1; fi
            echo "warning: Tavi not found (run tools/fetch-tavi.sh); skipping"; exit 0
          fi
          echo "Embedding Tavi $(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$src/Contents/Info.plist") from $src"
          identity="${EXPANDED_CODE_SIGN_IDENTITY:-$CODE_SIGN_IDENTITY}"
          if [ -z "$identity" ] || [ "$identity" = "-" ]; then
            if [ "$CONFIGURATION" = "Release" ]; then echo "error: no signing identity for the Tavi helper"; exit 1; fi
            identity="-"
          fi
          mkdir -p "$dst"
          rm -rf "$dst/TaviInputMethod.app"
          ditto "$src" "$dst/TaviInputMethod.app"
          codesign --force --sign "$identity" --timestamp=none "$dst/TaviInputMethod.app"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lyu.orbit
        ASSETCATALOG_COMPILER_APPICON_NAME: Orbit
        INFOPLIST_KEY_LSUIElement: YES
        GENERATE_INFOPLIST_FILE: NO
  # Loaded by /usr/bin/perl, never by Orbit: macOS only answers Now Playing questions from Apple's own processes.
  OrbitMediaRemote:
    type: library.dynamic
    platform: macOS
    sources:
      - path: NowPlayingAdapter
    settings:
      base:
        PRODUCT_NAME: OrbitMediaRemote
        EXECUTABLE_PREFIX: ""
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        CLANG_ENABLE_OBJC_ARC: YES
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: NO
  OrbitQuickLook:
    type: app-extension
    platform: macOS
    sources:
      - path: OrbitQuickLook
      - path: Orbit/Modules/Archives/LibArchive.swift
    info:
      path: OrbitQuickLook/Info.plist
      properties:
        CFBundleDisplayName: Orbit Preview
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewViewController
          NSExtensionAttributes:
            QLIsDataBasedPreview: false
            QLSupportsSearchableItems: false
            QLSupportedContentTypes:
              - public.folder
              - public.zip-archive
              - org.7-zip.7-zip-archive
              - com.rarlab.rar-archive
              - public.tar-archive
              - org.gnu.gnu-zip-archive
              - org.gnu.gnu-zip-tar-archive
              - public.bzip2-archive
              - public.tar-bzip2-archive
              - org.tukaani.xz-archive
              - org.tukaani.tar-xz-archive
              - public.lzip-archive
              - org.tukaani.lzma-archive
              - com.facebook.zstandard-archive
              - public.z-archive
              - public.cpio-archive
              - public.archive.lha
              - com.microsoft.cab
    entitlements:
      path: OrbitQuickLook/OrbitQuickLook.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    settings:
      base:
        PRODUCT_NAME: OrbitQuickLook
        PRODUCT_BUNDLE_IDENTIFIER: com.lyu.orbit.quicklook
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
  OrbitFanHelper:
    type: tool
    platform: macOS
    sources:
      - path: FanHelper
      - path: Orbit/Modules/Fans/SMC.swift
      - path: Orbit/Modules/Fans/FanHelperProtocol.swift
      - path: Orbit/Modules/Battery/BatteryIO.swift
    settings:
      base:
        PRODUCT_NAME: OrbitFanHelper
        PRODUCT_BUNDLE_IDENTIFIER: com.lyu.orbit.fanhelper
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        SKIP_INSTALL: YES
        OTHER_CODE_SIGN_FLAGS: "--identifier com.lyu.orbit.fanhelper"
